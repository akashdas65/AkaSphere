services:

  postgres:
    image: postgres:17
    container_name: akasphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: akasphere
      POSTGRES_USER: akasphere
      POSTGRES_PASSWORD: akasphere_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U akasphere -d akasphere"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: akasphere-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data: